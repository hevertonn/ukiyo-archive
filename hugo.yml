baseURL: "https://hevertonn.github.io/ukiyo-archive/"
title: "Ukiyo Archive"
copyright: "© 2026 Heverton Borges"
theme: PaperMod
defaultContentLanguage: pt

params:
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  displayFullLangName: true

  socialIcons:
    - name: "github"
      url: "https://github.com/hevertonn"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/hevertonn/"
    - name: "email"
      url: "mailto:hb.hevertonborges@gmail.com"

languages:
  en:
    label: "English 🇺🇸"

    params:
      homeInfoParams:
        Title: "Hi there, I'm Heverton."

    menu:
      main:
      - name: Archive
        url: archives/
        weight: 5
      - name: Search
        url: search/
        weight: 10
      - name: Tags
        url: tags/
        weight: 15

  pt:
    label: "Português 🇧🇷"

    params:
      homeInfoParams:
        Title: "Olá pessoal, Heverton aqui."

    menu:
      main:
      - name: Arquivos
        url: archives/
        weight: 5
      - name: Pesquisar
        url: search/
        weight: 10
      - name: Tags
        url: tags/
        weight: 15

outputs:
  home:
    - HTML
    - RSS
    - JSON
